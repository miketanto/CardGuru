<title>Encoder Options</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Spectral:wght@600;700&display=swap">
<style>
:root{
  --ground:#F6F7F5; --surface:#FFFFFF; --raise:#FBFCFB;
  --ink:#16211D; --muted:#5E6D67; --line:#DCE3E0;
  --have:#0B6E5F; --build:#9E4A31; --frozen:#7A5C2E;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0D1513; --surface:#141E1B; --raise:#18241F;
  --ink:#E4EBE8; --muted:#93A39D; --line:#26332F;
  --have:#5FC9B4; --build:#E29273; --frozen:#D6AC63;
}}
:root[data-theme="dark"]{
  --ground:#0D1513; --surface:#141E1B; --raise:#18241F;
  --ink:#E4EBE8; --muted:#93A39D; --line:#26332F;
  --have:#5FC9B4; --build:#E29273; --frozen:#D6AC63;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:16px;line-height:1.6;}
.wrap{max-width:1040px;margin:0 auto;padding:26px;display:flex;flex-direction:column;gap:34px;}
figure{margin:0;display:flex;flex-direction:column;gap:.65rem;}
.figbox{background:var(--surface);border:1px solid var(--line);border-radius:10px;
  padding:20px;overflow-x:auto;box-shadow:0 1px 2px rgba(20,40,34,.06),0 8px 24px -12px rgba(20,40,34,.14);}
figure svg{display:block;max-width:100%;height:auto;color:var(--ink);}
figcaption{font-size:.87rem;color:var(--muted);max-width:74ch;}
h2{font-family:Spectral,Georgia,serif;font-size:1.4rem;margin:0;}
.tag{font-family:"IBM Plex Mono",monospace;font-size:.68rem;letter-spacing:.08em;
  text-transform:uppercase;padding:2px 7px;border-radius:4px;border:1px solid currentColor;}
.hdr{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;}
.tradeoff{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;
  font-size:.85rem;}
.tradeoff div{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--raise);}
.tradeoff b{font-family:"IBM Plex Mono",monospace;font-size:.68rem;letter-spacing:.08em;
  text-transform:uppercase;color:var(--muted);display:block;margin-bottom:3px;}
</style>
<div class="wrap">
