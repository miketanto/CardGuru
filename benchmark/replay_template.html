<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root {
    --bg:#101613; --surface:#1A231D; --surface2:#141C17; --line:#2C382F;
    --ink:#E9EDE7; --muted:#94A29A; --faint:#5F6E64;
    --red:#DF6A48; --red-soft:#3A241D; --green:#82B36C; --green-soft:#22301E;
    --gold:#E3BE66; --gold-soft:#332B18; --bad:#D4756B; --bad-soft:#35211F;
  }
  * { box-sizing:border-box; }
  html { color-scheme: dark; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font-family:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
         font-size:15px; line-height:1.5; }
  .shell { max-width:980px; margin:0 auto; padding:24px 20px 60px; }
  header h1 { font-family:"Fraunces",Georgia,serif; font-weight:700; font-size:27px;
              margin:0 0 4px; text-wrap:balance; }
  header .sub { color:var(--muted); font-size:13.5px; max-width:75ch; }

  .ticker { display:flex; align-items:baseline; gap:14px; margin:18px 0 10px;
            font-family:"IBM Plex Mono",monospace; }
  .ticker .turn { font-family:"Fraunces",Georgia,serif; font-size:22px; font-weight:600; }
  .ticker .phase { color:var(--muted); font-size:13px; }
  .ticker .clock { margin-left:auto; color:var(--faint); font-size:12px; }

  .board { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  @media (max-width:640px){ .board{ grid-template-columns:1fr; } }
  .side { background:var(--surface); border:1px solid var(--line); border-radius:10px;
          padding:12px 14px; min-height:190px; }
  .side.us { border-top:3px solid var(--red); }
  .side.them { border-top:3px solid var(--green); }
  .side h3 { margin:0 0 8px; font-size:12.5px; font-weight:600; letter-spacing:.04em;
             text-transform:uppercase; color:var(--muted);
             display:flex; justify-content:space-between; align-items:baseline; }
  .life { font-family:"IBM Plex Mono",monospace; font-size:19px; font-weight:600;
          color:var(--ink); transition:color .25s; }
  .life.hit { color:var(--bad); animation:pulse .5s; }
  @keyframes pulse { 0%{transform:scale(1.35);} 100%{transform:scale(1);} }
  .cards { display:flex; flex-wrap:wrap; gap:6px; min-height:28px; }
  .card { border:1px solid var(--line); border-radius:6px; padding:3px 8px;
          font-size:12.5px; background:var(--surface2); white-space:nowrap;
          transition:opacity .3s, transform .3s; }
  .card.tapped { opacity:.5; transform:rotate(-4deg); }
  .card.enter { animation:enter .5s; }
  @keyframes enter { 0%{background:var(--gold-soft); transform:scale(1.12);} }
  .card .pt { font-family:"IBM Plex Mono",monospace; color:var(--muted);
              margin-left:5px; font-size:11px; }
  .card.creature.us-c { border-color:var(--red); }
  .card.creature.them-c { border-color:var(--green); }
  .zone-label { font-size:10.5px; letter-spacing:.06em; text-transform:uppercase;
                color:var(--faint); margin:9px 0 4px; }

  .caption { background:var(--surface); border:1px solid var(--line); border-radius:10px;
             padding:11px 14px; margin-top:12px; min-height:58px;
             display:flex; gap:12px; align-items:flex-start; }
  .chip { font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.07em;
          text-transform:uppercase; padding:2px 9px; border-radius:999px;
          font-weight:600; flex:none; margin-top:2px; }
  .chip.pilot { background:var(--gold-soft); color:var(--gold); }
  .chip.auto { background:var(--surface2); color:var(--faint); }
  .chip.fallback { background:var(--bad-soft); color:var(--bad); }
  .chip.result { background:var(--green-soft); color:var(--green); }
  .caption .text { color:var(--ink); max-width:70ch; }
  .caption .ans { font-family:"IBM Plex Mono",monospace; font-size:11.5px;
                  color:var(--muted); margin-top:3px; }

  .transport { display:flex; gap:10px; align-items:center; margin-top:14px;
               background:var(--surface2); border:1px solid var(--line);
               border-radius:10px; padding:10px 14px; flex-wrap:wrap; }
  .transport button { background:var(--surface); color:var(--ink);
                      border:1px solid var(--line); border-radius:8px;
                      padding:6px 13px; font:inherit; font-size:14px; cursor:pointer; }
  .transport button:hover { border-color:var(--muted); }
  .transport button:focus-visible { outline:2px solid var(--gold); outline-offset:1px; }
  .transport button.play { min-width:74px; font-weight:600; }
  .transport select { background:var(--surface); color:var(--ink);
                      border:1px solid var(--line); border-radius:8px;
                      padding:6px 8px; font:inherit; font-size:13px; }
  .transport input[type=range] { flex:1; min-width:140px; accent-color:var(--gold); }
  .transport .pos { font-family:"IBM Plex Mono",monospace; font-size:12px;
                    color:var(--muted); min-width:110px; text-align:right; }
  footer { margin-top:20px; color:var(--faint); font-size:12.5px; max-width:78ch; }
  footer b { color:var(--muted); }
</style>

<div class="shell">
<header>
  <h1 id="title"></h1>
  <div class="sub" id="subtitle"></div>
</header>

<div class="ticker">
  <span class="turn" id="turn"></span>
  <span class="phase" id="phase"></span>
  <span class="clock" id="clock"></span>
</div>

<div class="board" id="board"></div>
<div class="caption" id="caption"></div>

<div class="transport">
  <button id="restart" aria-label="restart">&#9198;</button>
  <button id="play" class="play" aria-label="play or pause">&#9654; Play</button>
  <button id="step-b" aria-label="step back">&#8592;</button>
  <button id="step-f" aria-label="step forward">&#8594;</button>
  <select id="speed" aria-label="playback speed">
    <option value="0.5">0.5&times;</option>
    <option value="1" selected>1&times;</option>
    <option value="2">2&times;</option>
    <option value="4">4&times;</option>
  </select>
  <input type="range" id="scrub" min="0" value="0" step="1" aria-label="scrub timeline">
  <span class="pos" id="pos"></span>
</div>

<footer id="footer"></footer>
</div>

<script id="meta" type="application/json">/*__META__*/{}</script>
<script id="frames" type="application/json">/*__FRAMES__*/[]</script>
<script>
const META = JSON.parse(document.getElementById('meta').textContent);
const FRAMES = JSON.parse(document.getElementById('frames').textContent);
const N = FRAMES.length;
let cur = 0, playing = false, timer = null;

document.getElementById('title').textContent = META.title;
document.getElementById('subtitle').textContent = META.subtitle;
document.getElementById('scrub').max = N - 1;
const counts = META.counts || {};
document.getElementById('footer').innerHTML =
  `<b>${N}</b> decisions &mdash; ${counts.pilot ?? 0} pilot, ${counts.auto ?? 0} auto/yield, ` +
  `${counts.fallback ?? 0} fallback` +
  (META.result ? ` &middot; result: <b>${esc(JSON.stringify(META.result))}</b>` : '') +
  ` &middot; space = play/pause, &#8592;/&#8594; = step`;

function esc(s){ return String(s ?? "").replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

let prevCards = {us: new Set(), them: new Set()};
let prevLife = {us: null, them: null};

function cardKey(c, i){ return (c.name || '?') + '#' + i; }

function cardHtml(c, side, isNew){
  const isCreature = 'power' in c;
  const cls = ['card', c.tapped ? 'tapped' : '', isCreature ? 'creature' : '',
               isCreature ? side : '', isNew ? 'enter' : ''].join(' ');
  const sick = c.summoning_sick ? ' &middot; sick' : '';
  const pt = isCreature
    ? `<span class="pt">${c.power}/${c.toughness}${c.tapped ? ' &middot; T' : ''}${sick}</span>`
    : (c.tapped ? '<span class="pt">T</span>' : '');
  return `<span class="${cls}">${esc(c.name)}${pt}</span>`;
}

function sideHtml(label, cls, s, isUs, animate){
  if (!s) return '';
  const key = isUs ? 'us' : 'them';
  const seen = new Set();
  const bf = (s.battlefield || []).map((c, i) => {
    const k = cardKey(c, i); seen.add(k);
    return cardHtml(c, isUs ? 'us-c' : 'them-c', animate && !prevCards[key].has(k));
  }).join('') || '<span class="pt" style="color:var(--faint)">empty</span>';
  prevCards[key] = seen;
  const hit = animate && prevLife[key] !== null && s.life < prevLife[key];
  prevLife[key] = s.life;
  let hand;
  if (isUs && Array.isArray(s.hand)) {
    hand = s.hand.length
      ? s.hand.map(c => `<span class="card">${esc(c.name || c)}</span>`).join('')
      : '<span class="pt" style="color:var(--faint)">empty</span>';
  } else {
    hand = `<span class="pt" style="color:var(--faint)">${s.hand_count ?? 0} hidden</span>`;
  }
  const gy = (s.graveyard || []).length
    ? `<div class="zone-label">graveyard</div><div class="cards">${s.graveyard.map(n => `<span class="card" style="opacity:.55">${esc(n)}</span>`).join('')}</div>` : '';
  return `<section class="side ${cls}"><h3><span>${esc(label)}</span>` +
    `<span class="life${hit ? ' hit' : ''}">${s.life}</span></h3>` +
    `<div class="zone-label">battlefield</div><div class="cards">${bf}</div>` +
    `<div class="zone-label">hand</div><div class="cards">${hand}</div>${gy}</section>`;
}

const KINDLBL = {priority:"priority", target:"choose target", choose:"choice",
  blockers:"declare blockers", attackers:"declare attackers", mulligan:"mulligan"};
const CHIPLBL = {pilot:"Pilot", auto:"Auto", fallback:"Fallback"};

function render(animate){
  const f = FRAMES[cur];
  document.getElementById('turn').textContent = f.turn ? `Turn ${f.turn}` : 'Pre-game';
  const phase = (f.phase && f.phase !== 'null') ? f.phase + ' · ' : '';
  const who = f.active === 'A' ? ' · our turn' : f.active === 'B' ? ' · their turn' : '';
  document.getElementById('phase').textContent =
    phase + (KINDLBL[f.kind] || f.kind || '') + who;
  document.getElementById('clock').textContent = `frame ${cur + 1}/${N}`;
  document.getElementById('board').innerHTML =
    sideHtml(META.playerA, 'us', f.state.A, true, animate) +
    sideHtml(META.playerB, 'them', f.state.B, false, animate);
  const ans = f.response
    ? esc(JSON.stringify(Object.fromEntries(Object.entries(f.response).filter(([k]) => k !== 'why'))))
    : '';
  document.getElementById('caption').innerHTML =
    `<span class="chip ${f.src}">${CHIPLBL[f.src] || f.src}</span>` +
    `<div><div class="text">${esc(f.why) || '<span style="color:var(--faint)">no comment</span>'}</div>` +
    `<div class="ans">${ans}</div></div>`;
  document.getElementById('scrub').value = cur;
  document.getElementById('pos').textContent = `T${f.turn ?? '—'} · ${cur + 1}/${N}`;
}

function frameDuration(f){
  const base = f.src === 'pilot' ? 1900 : f.src === 'fallback' ? 1900 : 240;
  return base / parseFloat(document.getElementById('speed').value);
}

function tick(){
  if (!playing) return;
  if (cur >= N - 1) { setPlaying(false); return; }
  cur++;
  render(true);
  timer = setTimeout(tick, frameDuration(FRAMES[cur]));
}

function setPlaying(p){
  playing = p;
  clearTimeout(timer);
  document.getElementById('play').innerHTML = p ? '&#9646;&#9646; Pause' : '&#9654; Play';
  if (p) {
    if (cur >= N - 1) { cur = 0; render(false); }
    timer = setTimeout(tick, frameDuration(FRAMES[cur]));
  }
}

document.getElementById('play').addEventListener('click', () => setPlaying(!playing));
document.getElementById('restart').addEventListener('click', () => { setPlaying(false); cur = 0; render(false); });
document.getElementById('step-f').addEventListener('click', () => { setPlaying(false); if (cur < N - 1) { cur++; render(true); } });
document.getElementById('step-b').addEventListener('click', () => { setPlaying(false); if (cur > 0) { cur--; render(false); } });
document.getElementById('scrub').addEventListener('input', e => { setPlaying(false); cur = +e.target.value; render(false); });
document.getElementById('speed').addEventListener('change', () => { if (playing) { clearTimeout(timer); timer = setTimeout(tick, frameDuration(FRAMES[cur])); } });
document.addEventListener('keydown', e => {
  if (e.key === ' ') { e.preventDefault(); setPlaying(!playing); }
  if (e.key === 'ArrowRight') { setPlaying(false); if (cur < N - 1) { cur++; render(true); } }
  if (e.key === 'ArrowLeft') { setPlaying(false); if (cur > 0) { cur--; render(false); } }
});
render(false);
</script>
