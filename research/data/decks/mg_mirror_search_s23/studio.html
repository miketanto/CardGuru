<style>
  :root {
    --bg:#0F1512; --surface:#18211C; --surface2:#121A15; --line:#2A362E;
    --ink:#EAEEE8; --muted:#95A39B; --faint:#5E6D63;
    --red:#E06E4C; --red-soft:#3A241D; --green:#84B56E; --green-soft:#22301E;
    --gold:#E6C267; --gold-soft:#342C18; --bad:#D6776D; --bad-soft:#35211F;
    --blue:#7FB3D5;
  }
  * { box-sizing:border-box; }
  html { color-scheme: dark; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font-family:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
         font-size:15px; line-height:1.45; padding:0 16px; }
  .shell { max-width:1400px; margin:0 auto; padding:18px 0 40px; }
  body.present { padding:0; overflow:hidden; background:#0B100D; }
  body.present .shell { width:1920px; height:1080px; max-width:none; margin:0;
                        padding:26px 34px; display:grid;
                        grid-template-rows:auto auto 1fr auto; gap:14px; }
  body.present .transport, body.present footer { display:none; }

  header { display:flex; align-items:baseline; gap:18px; flex-wrap:wrap; }
  header h1 { font-family:"Fraunces",Georgia,serif; font-weight:700; font-size:26px; margin:0; }
  header .sub { color:var(--muted); font-size:13.5px; }
  .ticker { display:flex; align-items:baseline; gap:14px; font-family:"IBM Plex Mono",monospace; }
  .ticker .turn { font-family:"Fraunces",Georgia,serif; font-size:22px; font-weight:600; }
  .ticker .phase { color:var(--muted); font-size:13px; }
  .ticker .who { font-size:12px; padding:2px 9px; border-radius:999px; font-weight:600; }
  .ticker .who.us { background:var(--red-soft); color:var(--red); }
  .ticker .who.them { background:var(--green-soft); color:var(--green); }
  .ticker .clock { margin-left:auto; color:var(--faint); font-size:12px; }

  .main { display:grid; grid-template-columns:minmax(380px, 5fr) minmax(420px, 7fr); gap:14px; min-height:0; }
  @media (max-width:900px){ .main{ grid-template-columns:1fr; } }
  .boardcol { display:flex; flex-direction:column; gap:12px; min-height:0; }
  .side { background:var(--surface); border:1px solid var(--line); border-radius:10px;
          padding:11px 13px; }
  .side.us { border-top:3px solid var(--red); }
  .side.them { border-top:3px solid var(--green); }
  .side h3 { margin:0 0 7px; font-size:12.5px; font-weight:600; letter-spacing:.04em;
             text-transform:uppercase; color:var(--muted);
             display:flex; justify-content:space-between; align-items:baseline; }
  .life { font-family:"IBM Plex Mono",monospace; font-size:20px; font-weight:600; color:var(--ink); }
  .life.hit { color:var(--bad); animation:pulse .5s; }
  @keyframes pulse { 0%{transform:scale(1.35);} 100%{transform:scale(1);} }
  .cards { display:flex; flex-wrap:wrap; gap:6px; min-height:26px; }
  .card { border:1px solid var(--line); border-radius:6px; padding:3px 8px;
          font-size:12.5px; background:var(--surface2); white-space:nowrap;
          transition:opacity .3s, transform .3s; }
  .card.tapped { opacity:.5; transform:rotate(-4deg); }
  .card.enter { animation:enter .5s; }
  @keyframes enter { 0%{background:var(--gold-soft); transform:scale(1.12);} }
  .card .pt { font-family:"IBM Plex Mono",monospace; color:var(--muted); margin-left:5px; font-size:11px; }
  .card.creature.us-c { border-color:var(--red); }
  .card.creature.them-c { border-color:var(--green); }
  .card.attacking { box-shadow:0 0 0 2px var(--gold-soft); border-color:var(--gold); }
  .zone-label { font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--faint); margin:8px 0 4px; }
  .stack { background:var(--surface2); border:1px dashed var(--line); border-radius:8px;
           padding:6px 10px; font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--muted); }
  .stack b { color:var(--gold); font-weight:600; }

  .decision { background:var(--surface); border:1px solid var(--line); border-radius:10px;
              padding:12px 14px; display:flex; flex-direction:column; min-height:360px; }
  .decision h3 { margin:0 0 6px; font-size:12.5px; font-weight:600; letter-spacing:.04em;
                 text-transform:uppercase; color:var(--muted); display:flex; gap:10px; align-items:center; }
  .chip { font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.07em;
          text-transform:uppercase; padding:2px 9px; border-radius:999px; font-weight:600; }
  .chip.pilot { background:var(--gold-soft); color:var(--gold); }
  .chip.search { background:#1E2C3A; color:var(--blue); }
  .chip.planning { background:#2A2238; color:#C7A8F0; }
  .chip.plan { background:var(--surface2); color:var(--muted); }
  .chip.auto { background:var(--surface2); color:var(--faint); }
  .chip.fallback { background:var(--bad-soft); color:var(--bad); }
  .treewrap { flex:1; min-height:220px; overflow:hidden; position:relative; }
  svg.tree { width:100%; height:100%; display:block; }
  .node rect { fill:var(--surface2); stroke:var(--line); stroke-width:1.2; rx:7; }
  .node text { fill:var(--ink); font-size:12px; font-family:"IBM Plex Sans",sans-serif; }
  .node.root rect { fill:var(--surface); stroke:var(--muted); }
  .node.candidate rect { stroke:var(--muted); }
  .node.candidate text { font-weight:600; }
  .node.group rect { fill:transparent; stroke:transparent; }
  .node.group text { fill:var(--faint); text-transform:uppercase; letter-spacing:.06em; font-size:10.5px; }
  .node.leaf .score { font-family:"IBM Plex Mono",monospace; font-weight:600; font-size:12px; }
  .node.leaf .life { font-size:10.5px; fill:var(--muted); font-family:"IBM Plex Mono",monospace; }
  .node .agg { font-family:"IBM Plex Mono",monospace; font-size:11.5px; fill:var(--gold); font-weight:600; }
  .node.chosen rect { stroke:var(--gold); stroke-width:2.2; fill:var(--gold-soft); }
  .node.dim { opacity:.45; }
  .edge { fill:none; stroke:var(--line); stroke-width:1.4; }
  .edge.chosen { stroke:var(--gold); stroke-width:2.2; }
  .anim .node { opacity:0; animation:pop .35s ease-out forwards; }
  .anim .edge { stroke-dasharray:600; stroke-dashoffset:600; animation:draw .45s ease-out forwards; }
  .anim .agg { opacity:0; animation:fade .3s ease-out forwards; }
  @keyframes pop { 0%{opacity:0; transform:translateY(6px);} 100%{opacity:1; transform:none;} }
  @keyframes draw { to { stroke-dashoffset:0; } }
  @keyframes fade { to { opacity:1; } }
  .why { margin-top:10px; border-top:1px solid var(--line); padding-top:9px; font-size:14px; }
  .why .plan { color:var(--muted); font-size:13px; margin-top:5px; }
  .why .plan b { color:var(--gold); font-weight:600; }
  .why .ans { font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--faint); margin-top:5px; }
  .why .note { color:var(--muted); font-style:italic; }
  .options { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .opt { border:1px solid var(--line); border-radius:6px; padding:2px 8px; font-size:12px; color:var(--muted); }
  .opt.picked { border-color:var(--gold); color:var(--gold); background:var(--gold-soft); }

  .transport { display:flex; gap:10px; align-items:center; margin-top:14px;
               background:var(--surface2); border:1px solid var(--line);
               border-radius:10px; padding:10px 14px; flex-wrap:wrap; }
  .transport button { background:var(--surface); color:var(--ink); border:1px solid var(--line);
                      border-radius:8px; padding:6px 13px; font:inherit; font-size:14px; cursor:pointer; }
  .transport button:hover { border-color:var(--muted); }
  .transport button.play { min-width:74px; font-weight:600; }
  .transport select { background:var(--surface); color:var(--ink); border:1px solid var(--line);
                      border-radius:8px; padding:6px 8px; font:inherit; font-size:13px; }
  .transport input[type=range] { flex:1; min-width:140px; accent-color:var(--gold); }
  .transport .pos { font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--muted); min-width:110px; text-align:right; }
  .transport label { font-size:12.5px; color:var(--muted); display:flex; gap:5px; align-items:center; }
  footer { margin-top:16px; color:var(--faint); font-size:12.5px; max-width:90ch; }
  footer b { color:var(--muted); }
  body.present header h1 { font-size:30px; }
  body.present .card { font-size:14px; padding:4px 10px; }
  body.present .side h3 { font-size:13.5px; }
  body.present .life { font-size:24px; }
  body.present .why { font-size:16px; }
  body.present .node text { font-size:13.5px; }
</style>

<script>
const META = JSON.parse(document.getElementById('meta').textContent);
const FRAMES = JSON.parse(document.getElementById('frames').textContent);
const N = FRAMES.length;
const PRESENT = new URLSearchParams(location.search).get('present') === '1';
if (PRESENT) document.body.classList.add('present');
let cur = 0, playing = false, timer = null;

document.getElementById('title').textContent = META.title;
document.getElementById('subtitle').textContent = META.subtitle;
document.getElementById('scrub').max = N - 1;
const counts = META.counts || {};
document.getElementById('footer').innerHTML =
  `<b>${N}</b> frames — ${counts.pilot ?? 0} pilot decisions, ${counts.search ?? 0} searches, ` +
  `${(counts.planning ?? 0)} plans, ${(counts.plan ?? 0)} plan-executed, ${counts.auto ?? 0} auto` +
  (META.result ? ` · result: <b>${esc(JSON.stringify(META.result))}</b>` : '') +
  ` · space = play/pause, ←/→ = step`;

function esc(s){ return String(s ?? "").replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

let prevCards = {us: new Set(), them: new Set()};
let prevLife = {us: null, them: null};
function cardKey(c, i){ return (c.name || '?') + '#' + i; }

function cardHtml(c, side, isNew){
  const isCreature = 'power' in c;
  const cls = ['card', c.tapped ? 'tapped' : '', isCreature ? 'creature' : '',
               isCreature ? side : '', isNew ? 'enter' : '', c.attacking ? 'attacking' : ''].join(' ');
  const sick = c.summoning_sick ? ' · sick' : '';
  const blk = c.blocking ? ' · blocks ' + esc(c.blocking.join(',')) : '';
  const pt = isCreature
    ? `<span class="pt">${c.power}/${c.toughness}${c.tapped ? ' · T' : ''}${sick}${blk}</span>`
    : (c.tapped ? '<span class="pt">T</span>' : '');
  return `<span class="${cls}">${esc(c.name)}${pt}</span>`;
}

function sideHtml(label, cls, s, isUs, animate){
  if (!s) return '';
  const key = isUs ? 'us' : 'them';
  const seen = new Set();
  const bf = (s.battlefield || []).map((c, i) => {
    const k = cardKey(c, i); seen.add(k);
    return cardHtml(c, isUs ? 'us-c' : 'them-c', animate && !prevCards[key].has(k));
  }).join('') || '<span class="pt" style="color:var(--faint)">empty</span>';
  prevCards[key] = seen;
  const hit = animate && prevLife[key] !== null && s.life < prevLife[key];
  prevLife[key] = s.life;
  let hand;
  if (isUs && Array.isArray(s.hand)) {
    hand = s.hand.length ? s.hand.map(c => `<span class="card">${esc(c.name || c)}</span>`).join('')
                         : '<span class="pt" style="color:var(--faint)">empty</span>';
  } else {
    hand = `<span class="pt" style="color:var(--faint)">${s.hand_count ?? 0} hidden</span>`;
  }
  const gy = (s.graveyard || []).length
    ? `<div class="zone-label">graveyard (${s.graveyard.length})</div><div class="cards">${s.graveyard.slice(-8).map(n => `<span class="card" style="opacity:.55">${esc(n)}</span>`).join('')}</div>` : '';
  return `<section class="side ${cls}"><h3><span>${esc(label)}</span>` +
    `<span class="life${hit ? ' hit' : ''}">${s.life}</span></h3>` +
    `<div class="zone-label">battlefield</div><div class="cards">${bf}</div>` +
    `<div class="zone-label">hand</div><div class="cards">${hand}</div>${gy}</section>`;
}

const KINDLBL = {priority:"priority window", target:"choose target", choose:"choice",
  blockers:"declare blockers", attackers:"declare attackers", mulligan:"mulligan",
  leaf_eval:"search", turn_plan:"turn plan", mode:"choose mode", use:"yes / no", announce_x:"choose X"};
const CHIPLBL = {pilot:"Pilot", auto:"Auto", fallback:"Fallback", search:"Search", planning:"Plan", plan:"Plan-executed"};

function scoreColor(s){
  if (s == null) return 'var(--faint)';
  const t = Math.max(0, Math.min(1, s / 100));
  const r = Math.round(214 + (132 - 214) * t), g = Math.round(119 + (181 - 119) * t), b = Math.round(109 + (110 - 109) * t);
  return `rgb(${r},${g},${b})`;
}

// ---- tree layout: left-to-right, leaves stacked, parents centred on children ----
function layoutTree(tree, W, H){
  const nodes = tree.nodes.map(n => Object.assign({}, n, {children: []}));
  const byId = {}; nodes.forEach(n => byId[n.id] = n);
  nodes.forEach(n => { if (n.parent != null && byId[n.parent]) byId[n.parent].children.push(n); });
  const maxDepth = Math.max(...nodes.map(n => n.depth));
  const leaves = nodes.filter(n => n.children.length === 0);
  const rowH = Math.max(22, Math.min(34, (H - 20) / Math.max(1, leaves.length)));
  let y = 12;
  function place(n){
    if (!n.children.length) { n.y = y + rowH / 2; y += rowH; return; }
    n.children.forEach(place);
    n.y = (n.children[0].y + n.children[n.children.length - 1].y) / 2;
  }
  place(byId[0]);
  const CH = 6.9;   // approx px per character at 12px
  const GAP = 26;
  // extra width a node needs beyond its label: life + score on leaves, the aggregate on candidates
  const extra = n => n.kind === 'leaf' ? 92 : (n.kind === 'candidate' && n.agg != null ? 56 : 0);
  // natural column widths from the longest label per depth (capped), then shrink to fit W
  const fixed = [], label = [];
  for (let d = 0; d <= maxDepth; d++) {
    const col = nodes.filter(n => n.depth === d);
    label[d] = Math.min(44, Math.max(...col.map(n => n.label.length))) * CH + 3;   // +3px slack against rounding
    fixed[d] = 14 + Math.max(...col.map(extra)) + GAP;
  }
  const sum = a => a.reduce((x, y) => x + y, 0);
  const total = sum(fixed) + sum(label);
  const k = Math.max(0.25, Math.min(1, (W - 20 - sum(fixed)) / Math.max(1, sum(label))));   // shrink labels only
  const colW = fixed.map((f, d) => f + label[d] * k);
  const x0 = [];
  colW.reduce((acc, w, d) => { x0[d] = acc; return acc + w; }, 10);
  nodes.forEach(n => {
    n.x = x0[n.depth];
    const maxW = colW[n.depth] - GAP;
    n.fit = Math.max(6, Math.floor((maxW - 14 - extra(n)) / CH + 0.1));
    n.text = n.label.length > n.fit ? n.label.slice(0, n.fit - 1) + '…' : n.label;
    n.w = n.kind === 'leaf' ? maxW : Math.min(maxW, 14 + n.text.length * CH + extra(n));
    n.h = Math.min(rowH - 4, 26);
  });
  return {nodes, byId, rowH, colW, total};
}

function renderTree(tree, animate){
  const svg = document.getElementById('tree');
  const box = svg.parentElement.getBoundingClientRect();
  const W = Math.max(300, box.width), H = Math.max(200, box.height);
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  if (!tree) { svg.innerHTML = ''; return; }
  // presentation mode: scale the drawing up while the leaves still fit
  const leafN = tree.nodes.filter(n => !tree.nodes.some(m => m.parent === n.id)).length;
  const natural = layoutTree(tree, 1e6, H).total;   // width the labels would like
  const scale = PRESENT ? Math.max(1, Math.min(1.6, H / (leafN * 34 + 30), (W - 20) / natural)) : 1;
  const {nodes, byId} = layoutTree(tree, W / scale, H / scale);
  svg.setAttribute('viewBox', `0 0 ${W / scale} ${H / scale}`);
  const chosenPath = new Set();
  nodes.forEach(n => { if (n.chosen) { let p = n; while (p) { chosenPath.add(p.id); p = p.parent != null ? byId[p.parent] : null; } } });
  const order = {}; let k = 0;
  // reveal order: by depth then y, so the tree grows left to right
  nodes.slice().sort((a, b) => a.depth - b.depth || a.y - b.y).forEach(n => order[n.id] = k++);
  const dt = animate ? Math.min(90, 2200 / Math.max(1, nodes.length)) : 0;
  let out = '';
  nodes.forEach(n => {
    if (n.parent == null) return;
    const p = byId[n.parent];
    const x1 = p.x + p.w, y1 = p.y, x2 = n.x, y2 = n.y, mx = (x1 + x2) / 2;
    const cls = 'edge' + (chosenPath.has(n.id) && chosenPath.has(p.id) ? ' chosen' : '');
    out += `<path class="${cls}" d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}" style="animation-delay:${order[n.id] * dt}ms"></path>`;
  });
  nodes.forEach(n => {
    const dim = tree.chosen != null && n.depth >= 1 && !chosenPath.has(n.id) && n.kind !== 'group';
    const cls = ['node', n.kind, n.chosen ? 'chosen' : '', dim ? 'dim' : ''].join(' ');
    const ty = n.y + 4;
    let inner = `<rect x="${n.x}" y="${n.y - n.h / 2}" width="${n.w}" height="${n.h}"></rect>`;
    if (n.kind === 'leaf') {
      const life = n.life ? `${n.life[0]}–${n.life[1]}` : '';
      inner += `<text x="${n.x + 7}" y="${ty}">${esc(n.text)}</text>` +
        `<text class="life" x="${n.x + n.w - 62}" y="${ty}">${esc(life)}</text>` +
        `<text class="score" x="${n.x + n.w - 26}" y="${ty}" style="fill:${scoreColor(n.score)}">${n.score ?? '–'}</text>`;
    } else if (n.kind === 'candidate' && n.agg != null) {
      inner += `<text x="${n.x + 7}" y="${ty}">${esc(n.text)}</text>` +
        `<text class="agg" text-anchor="end" x="${n.x + n.w - 6}" y="${ty}" style="animation-delay:${(order[n.id] * dt + 1500)}ms">${n.agg}</text>`;
    } else {
      inner += `<text x="${n.x + 7}" y="${ty}">${esc(n.text)}</text>`;
    }
    out += `<g class="${cls}" style="animation-delay:${order[n.id] * dt}ms"><title>${esc(n.full || n.label)}${n.our_board ? '\n' + esc(n.our_board) + '\nvs ' + esc(n.opp_board) : ''}</title>${inner}</g>`;
  });
  svg.innerHTML = out;
  svg.classList.toggle('anim', !!animate);
}

function render(animate){
  const f = FRAMES[cur];
  document.getElementById('turn').textContent = f.turn ? `Turn ${f.turn}` : 'Pre-game';
  document.getElementById('phase').textContent = (f.phase && f.phase !== 'null') ? f.phase : '';
  const who = document.getElementById('who');
  who.textContent = f.active === 'A' ? 'our turn' : f.active === 'B' ? 'their turn' : '';
  who.className = 'who ' + (f.active === 'A' ? 'us' : 'them');
  document.getElementById('clock').textContent = `frame ${cur + 1}/${N}`;
  const stack = f.stack && f.stack.length
    ? `<div class="stack">stack: ${f.stack.map(s => '<b>' + esc(s) + '</b>').join(' ← ')}</div>` : '';
  document.getElementById('board').innerHTML =
    sideHtml(META.playerB, 'them', f.state.B, false, animate) + stack +
    sideHtml(META.playerA, 'us', f.state.A, true, animate);
  document.getElementById('dchip').textContent = CHIPLBL[f.src] || f.src;
  document.getElementById('dchip').className = 'chip ' + f.src;
  let dtitle = KINDLBL[f.kind] || f.kind || '';
  if (f.kind === 'leaf_eval') dtitle = `search: ${f.decision} (${f.leaf_count ?? ''} simulated leaves)`;
  document.getElementById('dtitle').textContent = dtitle;
  renderTree(f.tree || null, animate);
  const picked = f.response && typeof f.response.choice === 'number' ? f.response.choice : null;
  const opts = f.options && f.options.length && f.kind !== 'leaf_eval'
    ? `<div class="options">${f.options.map(o => `<span class="opt${o.index === picked ? ' picked' : ''}">${esc(o.text)}</span>`).join('')}</div>` : '';
  const ans = f.response && Object.keys(f.response).length
    ? `<div class="ans">${esc(JSON.stringify(f.response).slice(0, 220))}</div>` : '';
  const why = f.why ? esc(f.why) : (f.note ? `<span class="note">${esc(f.note)}</span>` : '<span style="color:var(--faint)">no comment</span>');
  const plan = f.plan ? `<div class="plan"><b>plan</b> ${esc(f.plan)}</div>` : '';
  document.getElementById('why').innerHTML = `<div>${why}</div>${plan}${opts}${ans}`;
  document.getElementById('scrub').value = cur;
  document.getElementById('pos').textContent = `T${f.turn ?? '—'} · ${cur + 1}/${N}`;
}

function frameDuration(f){
  const base = f.src === 'search' ? 4200 : f.src === 'planning' ? 4200 : f.src === 'pilot' ? 2600
             : f.src === 'fallback' ? 1900 : f.src === 'plan' ? 500 : 240;
  return base / parseFloat(document.getElementById('speed').value);
}
function skippable(f){ return document.getElementById('skipauto').checked && f.src === 'auto'; }
function nextIndex(i){ let j = i + 1; while (j < N - 1 && skippable(FRAMES[j])) j++; return j; }

function tick(){
  if (!playing) return;
  if (cur >= N - 1) { setPlaying(false); return; }
  cur = nextIndex(cur);
  render(true);
  timer = setTimeout(tick, frameDuration(FRAMES[cur]));
}
function setPlaying(p){
  playing = p;
  clearTimeout(timer);
  document.getElementById('play').innerHTML = p ? '&#9646;&#9646; Pause' : '&#9654; Play';
  if (p) { if (cur >= N - 1) { cur = 0; render(false); } timer = setTimeout(tick, frameDuration(FRAMES[cur])); }
}
document.getElementById('play').addEventListener('click', () => setPlaying(!playing));
document.getElementById('restart').addEventListener('click', () => { setPlaying(false); cur = 0; render(false); });
document.getElementById('step-f').addEventListener('click', () => { setPlaying(false); if (cur < N - 1) { cur = nextIndex(cur); render(true); } });
document.getElementById('step-b').addEventListener('click', () => { setPlaying(false); if (cur > 0) { cur--; render(false); } });
document.getElementById('scrub').addEventListener('input', e => { setPlaying(false); cur = +e.target.value; render(false); });
document.getElementById('speed').addEventListener('change', () => { if (playing) { clearTimeout(timer); timer = setTimeout(tick, frameDuration(FRAMES[cur])); } });
document.addEventListener('keydown', e => {
  if (e.key === ' ') { e.preventDefault(); setPlaying(!playing); }
  if (e.key === 'ArrowRight') { setPlaying(false); if (cur < N - 1) { cur = nextIndex(cur); render(true); } }
  if (e.key === 'ArrowLeft') { setPlaying(false); if (cur > 0) { cur--; render(false); } }
});
window.addEventListener('resize', () => render(false));

// Scripting API for the video exporter: step deterministically, ask how long
// each frame should be shown, and report totals.
window.__replay = {
  total: N,
  index: () => cur,
  goto: (i, animate) => { setPlaying(false); cur = Math.max(0, Math.min(N - 1, i)); render(!!animate); return cur; },
  next: () => { setPlaying(false); const j = nextIndex(cur); if (j === cur) return null; cur = j; render(true); return cur; },
  duration: (i) => frameDuration(FRAMES[i ?? cur]),
  frame: (i) => { const f = FRAMES[i ?? cur]; return {turn: f.turn, phase: f.phase, src: f.src, kind: f.kind}; },
};
render(false);
</script>
