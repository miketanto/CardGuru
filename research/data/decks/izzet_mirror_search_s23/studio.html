<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sonnet 5 vs MAD — Izzet Spellementals mirror</title>
<style>
:root{--bg:#0e1013;--panel:#161a20;--panel2:#1c2129;--line:#2a313b;--ink:#e6e9ee;--mute:#9aa4b2;--faint:#5c6673;
  --us:#e0703c;--them:#5fa86b;--gold:#e9c46a;--red:#e05a5a;--blue:#6aa7ff;--purple:#b48be6;--cw:64px;--hw:56px;
  --sans:ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;--mono:ui-monospace,Menlo,Consolas,"Liberation Mono",monospace}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:13px}
body{padding:10px 14px}
header{display:flex;align-items:baseline;gap:14px;margin-bottom:6px}
header h1{font-size:20px;margin:0;font-weight:700;letter-spacing:.2px}
header .sub{color:var(--mute)}
header .vs{margin-left:auto;color:var(--mute);font-size:12px}
header .vs b.us{color:var(--us)} header .vs b.them{color:var(--them)}
.phasebar{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 10px;margin-bottom:8px;font-family:var(--mono);font-size:12px}
.phasebar .turn{font-weight:700;font-size:14px;font-family:var(--sans)}
.who.us{color:var(--us)} .who.them{color:var(--them)}
.steps{display:flex;gap:3px}
.stp{padding:1px 6px;border-radius:4px;color:var(--faint);border:1px solid transparent}
.stp.on{color:var(--ink);background:var(--panel2);border-color:var(--line)}
.chip{padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;background:#333}
.chip.pilot{background:#3a2d12;color:var(--gold)} .chip.search{background:#1a2b40;color:var(--blue)} .chip.planning,.chip.plan{background:#2b1d40;color:var(--purple)}
.chip.auto,.chip.event{background:#22262c;color:var(--mute)} .chip.fallback{background:#3a1c1c;color:var(--red)}
.clock{margin-left:auto;color:var(--mute)}

/* ---- board ---- */
#board{position:relative;display:grid;grid-template-columns:200px 1fr 250px 300px;gap:10px;height:640px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
#arrows{position:absolute;inset:0;pointer-events:none;overflow:visible}
.arr{fill:none;stroke-width:2.5;marker-end:url(#ah);opacity:.9}
.arr.tgt{stroke:var(--gold)} .arr.atk{stroke:var(--red)} .arr.blk{stroke:var(--blue);stroke-dasharray:5 4}
.leftcol{display:flex;flex-direction:column;gap:8px;min-height:0}
.ppanel{background:var(--panel2);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:8px;padding:8px 10px}
.ppanel.us{border-left-color:var(--us)} .ppanel.them{border-left-color:var(--them)}
.ppanel.active{box-shadow:0 0 0 1px var(--line),0 0 14px rgba(233,196,106,.12)}
.pname{font-size:12px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.4px}
.life{font-family:var(--mono);font-size:34px;font-weight:700;line-height:1.1;margin:2px 0}
.ppanel.us .life{color:var(--us)} .ppanel.them .life{color:var(--them)}
.life.hit{animation:hit .8s ease-out}
@keyframes hit{0%{color:#fff;text-shadow:0 0 12px var(--red)}100%{}}
.pstats{display:flex;gap:12px;color:var(--mute);font-family:var(--mono);font-size:12px}
.mana{display:flex;gap:2px;margin-top:4px;min-height:14px}
.pip{width:14px;height:14px;border-radius:50%;font-size:9px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;color:#111}
.pip.W{background:#f5f0d8}.pip.U{background:#8fc1ff}.pip.B{background:#8a8296;color:#eee}.pip.R{background:#ff9a7a}.pip.G{background:#8fd39a}.pip.C{background:#c9c9c9}
.pctr{color:var(--mute);font-size:11px;margin-top:2px}
.marks{margin-top:4px;display:flex;gap:4px}
.mk{font-size:10px;padding:1px 6px;border-radius:4px;background:#2b2f36;color:var(--mute)} .mk.act{color:var(--gold)} .mk.pr{color:var(--blue)}
#preview{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px;opacity:.35;transition:opacity .2s}
#preview.on{opacity:1}
#preview img{width:100%;max-height:250px;object-fit:contain;border-radius:8px;background:#000}
#preview .pvtext{font-size:11px;color:var(--mute);overflow:auto;line-height:1.35}
#preview .pvtext b{color:var(--ink)} .cost{font-family:var(--mono);color:var(--gold);font-size:11px}
#preview .tl{color:var(--faint);margin:2px 0} #preview .rl{white-space:pre-wrap;color:var(--ink)}

#battlefield{display:flex;flex-direction:column;gap:3px;min-height:0;overflow:hidden;justify-content:space-between}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:calc(var(--cw)*1.4 + 8px);padding:2px 4px;border-radius:6px;position:relative}
.row.hand{background:rgba(255,255,255,.025);--cw:var(--hw)}
.row.them.hand{border-bottom:1px dashed var(--line)} .row.us.hand{border-top:1px dashed var(--line)}
.rowlbl{position:absolute;right:6px;top:2px;font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.4px}
.midline{border-top:1px solid var(--line);margin:2px 0}
.empty{color:var(--faint);font-size:11px;padding:6px 4px;font-style:italic}
.c{position:relative;width:var(--cw);height:calc(var(--cw)*1.4);flex:none;border-radius:5px;transition:transform .2s}
.c img{width:var(--cw);height:calc(var(--cw)*1.4);border-radius:5px;object-fit:cover;display:block;box-shadow:0 2px 6px rgba(0,0,0,.5)}
.c:hover{transform:translateY(-3px) scale(1.04);z-index:5}
.c.tapped{width:calc(var(--cw)*1.4);height:var(--cw)}
.c.tapped img{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(90deg);filter:brightness(.72)}
.c.attacking img{outline:2px solid var(--red);outline-offset:1px}
.c.blocking img{outline:2px solid var(--blue);outline-offset:1px}
.c.enter{animation:enter .5s ease-out}
@keyframes enter{0%{transform:translateY(-14px) scale(.85);opacity:0}100%{}}
.pt{position:absolute;right:2px;bottom:2px;background:rgba(0,0,0,.85);color:#fff;font-family:var(--mono);font-size:11px;font-weight:700;padding:0 4px;border-radius:3px;border:1px solid #444}
.pt.hurt{color:#ff9a7a;border-color:var(--red)}
.loy{position:absolute;right:2px;bottom:2px;background:#1b2b45;color:#cfe3ff;font-family:var(--mono);font-size:11px;font-weight:700;padding:0 5px;border-radius:9px;border:1px solid var(--blue)}
.ctr{position:absolute;left:2px;top:2px;background:rgba(20,60,30,.9);color:#c8f5cf;font-size:9px;padding:0 4px;border-radius:3px;border:1px solid #3d8a4e;max-width:calc(100% - 4px);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.badge{position:absolute;left:2px;bottom:2px;font-size:9px;background:rgba(0,0,0,.8);color:var(--mute);padding:0 3px;border-radius:3px}
.att{position:absolute;left:calc(var(--k)*10px);top:calc(var(--k)*-8px);width:var(--cw);z-index:-1;opacity:.95}
.att img{width:var(--cw);height:calc(var(--cw)*1.4);border-radius:5px;filter:brightness(.8)}
.c.tapped .att{left:calc(50% - var(--cw)/2 + var(--k)*10px)}

.rightcol{display:flex;flex-direction:column;gap:8px;min-height:0}
#stack{flex:1;min-height:0;overflow:auto;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px}
.zlbl{font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px}
.sitem{display:flex;gap:6px;padding:5px;border-radius:6px;border:1px solid var(--line);border-left:3px solid var(--line);margin-bottom:5px;background:var(--panel)}
.sitem.us{border-left-color:var(--us)} .sitem.them{border-left-color:var(--them)}
.sitem.top{box-shadow:0 0 0 1px var(--gold)}
.sitem img{width:46px;height:64px;border-radius:4px;object-fit:cover;flex:none}
.sitem.abil img{filter:brightness(.55) saturate(.6)}
.stext{min-width:0;font-size:11px}
.sname{font-weight:700} .srules{color:var(--mute);line-height:1.3;max-height:52px;overflow:hidden}
.stg{color:var(--gold);margin-top:2px}
.abchip{font-size:9px;background:#2b2f36;color:var(--mute);padding:0 4px;border-radius:3px;text-transform:uppercase}
#piles{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px}
.pile{position:relative;height:74px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;overflow:hidden;cursor:pointer}
.pile.none{opacity:.45;cursor:default}
.pile img{width:100%;height:100%;object-fit:cover;opacity:.55}
.pilelbl{position:absolute;left:4px;top:3px;font-size:9px;color:var(--mute);text-transform:uppercase;letter-spacing:.3px;z-index:1;text-shadow:0 1px 2px #000}
.pilecount{position:absolute;right:4px;bottom:2px;font-family:var(--mono);font-weight:700;font-size:14px;z-index:1;text-shadow:0 1px 2px #000}

#log{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 8px;overflow:auto;font-family:var(--mono);font-size:11px;line-height:1.4;min-height:0}
.ev{padding:1px 4px;border-radius:3px;color:var(--mute);cursor:pointer}
.ev.future{display:none} .ev.now{background:#25303c;color:var(--ink)}
.ev.dec{color:var(--gold)} .ev.dec.search{color:var(--blue)} .ev.dec.planning{color:var(--purple)}
.ev:hover{background:#2a323c}

/* ---- decision area ---- */
.decision{margin-top:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.dhead{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.dhead .dtitle{font-size:12px;font-weight:700;letter-spacing:.4px;color:var(--mute)}
#timeline{position:relative;height:22px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;margin-bottom:6px;cursor:pointer}
#timeline svg{position:absolute;inset:0;width:100%;height:100%}
#timeline .tk{stroke:var(--line);stroke-width:1} #timeline .tt{fill:var(--faint);font-size:7px;font-family:var(--mono)}
#timeline .dot{position:absolute;top:50%;transform:translateY(-50%);border-radius:50%;background:var(--mute);opacity:.85}
#timeline .dot.pilot{background:var(--gold)} #timeline .dot.search{background:var(--blue)} #timeline .dot.planning{background:var(--purple)} #timeline .dot.fallback{background:var(--red)}
#timeline .dot:hover{outline:2px solid #fff}
#timeline .cursor{position:absolute;top:0;bottom:0;width:2px;background:#fff;margin-left:-1px;pointer-events:none}
.dgrid{display:grid;grid-template-columns:1fr 380px;gap:10px;height:420px}
.treewrap{position:relative;background:var(--panel2);border:1px solid var(--line);border-radius:8px;overflow:hidden}
#tree{width:100%;height:100%;display:block;cursor:grab} #tree.drag{cursor:grabbing}
#treehint[hidden]{display:none}
#treehint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--faint);font-size:13px;pointer-events:none}
.treehelp{position:absolute;right:8px;bottom:6px;font-size:10px;color:var(--faint);pointer-events:none}
.node rect{fill:#222831;stroke:#3a4350;stroke-width:1}
.node text{fill:var(--ink);font-size:12px;font-family:var(--sans);pointer-events:none}
.node.root rect{fill:#1a1f27;stroke:#4a5563}
.node.candidate rect{stroke:#55627a} .node.candidate text{font-weight:700}
.node.group rect{fill:none;stroke:none} .node.group text{fill:var(--faint);font-size:11px;letter-spacing:.5px;text-transform:uppercase}
.node.leaf rect{fill:#1f2630}
.node.chosen rect{stroke:var(--gold);stroke-width:2;fill:#2a2716}
.node.sel rect{stroke:#fff;stroke-width:2}
.node.dim{opacity:.45} .node.col rect{stroke-dasharray:4 3}
.node{cursor:pointer}
.node .lifetxt{fill:var(--mute);font-family:var(--mono);font-size:10px}
.node .score{font-family:var(--mono);font-weight:700;font-size:12px}
.node .agg{fill:var(--gold);font-family:var(--mono);font-weight:700;font-size:12px}
.node .pill{fill:var(--mute);font-family:var(--mono);font-size:10px}
.edge{fill:none;stroke:#3a4350;stroke-width:1.5} .edge.chosen{stroke:var(--gold);stroke-width:2.5}
#tree.anim .node{opacity:0;animation:pop .35s ease-out forwards}
#tree.anim .node.dim{animation-name:popdim}
#tree.anim .edge{stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw .5s ease-out forwards}
#tree.anim .agg{opacity:0;animation:fade .3s ease-out forwards}
@keyframes pop{0%{opacity:0;transform:translateX(-8px)}100%{opacity:1}}
@keyframes popdim{0%{opacity:0}100%{opacity:.45}}
@keyframes draw{to{stroke-dashoffset:0}} @keyframes fade{to{opacity:1}}
#detail{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;overflow:auto;font-size:12px;line-height:1.4}
.dh{font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.5px;margin:6px 0 3px}
.dline{font-weight:700;margin-bottom:4px}
.why{font-size:13px;line-height:1.45;margin:4px 0 6px}
.plan{color:var(--mute);margin:2px 0} .plan b{color:var(--ink)}
.kv{color:var(--mute);margin-top:4px} .kv b{color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin:2px 0}
.chipx{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:1px 6px;font-size:11px}
.scorebar{position:relative;height:18px;background:#111;border-radius:4px;margin:4px 0;overflow:hidden;font-family:var(--mono);font-size:11px}
.scorebar>div{position:absolute;left:0;top:0;bottom:0;opacity:.55}
.scorebar>span{position:absolute;left:6px;top:2px;white-space:nowrap}
.scorebar.small{height:16px;cursor:pointer} .scorebar.small:hover{outline:1px solid var(--mute)}
.options{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0}
.opt{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:2px 6px;color:var(--mute);font-size:11px}
.opt.picked{border-color:var(--gold);color:var(--ink)} .oi{color:var(--faint);margin-right:4px;font-family:var(--mono)}
.answer{font-family:var(--mono);font-size:10px;color:var(--faint);word-break:break-all;margin-top:4px}
.evd{font-family:var(--mono);font-size:11px;color:var(--mute)}
#tip{position:fixed;z-index:50;max-width:340px;background:#0b0d10;border:1px solid #3a4350;border-radius:6px;padding:6px 8px;font-size:12px;display:none;pointer-events:none;box-shadow:0 4px 16px rgba(0,0,0,.6)}
#tip.on{display:block} #tip .tb{color:var(--mute);font-size:11px}
#popover{position:absolute;z-index:40;left:220px;top:60px;width:560px;max-height:520px;overflow:auto;background:#0f1216;border:1px solid #3a4350;border-radius:8px;padding:8px;display:none;box-shadow:0 8px 30px rgba(0,0,0,.7)}
#popover.on{display:block}
.pohead{display:flex;justify-content:space-between;align-items:center;font-weight:700;margin-bottom:6px}
.pohead button{background:none;border:none;color:var(--mute);font-size:18px;cursor:pointer}
.pogrid{display:flex;flex-wrap:wrap;gap:6px}

.transport{display:flex;align-items:center;gap:8px;margin-top:8px;padding:6px 10px;background:var(--panel);border:1px solid var(--line);border-radius:8px;font-size:12px;flex-wrap:wrap}
.transport button{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:3px 10px;cursor:pointer;font-size:13px}
.transport input[type=range]{flex:1;min-width:120px}
.transport label{color:var(--mute);display:flex;align-items:center;gap:4px}
.transport select{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:4px}
.keys{color:var(--faint);font-size:11px}
footer{color:var(--faint);font-size:11px;margin-top:6px}

/* ---- presentation (1920x1080 capture) ---- */
body.present{width:1920px;height:1080px;padding:14px 22px;overflow:hidden;font-size:14px;--cw:66px;--hw:56px}
body.present header h1{font-size:26px}
body.present #board{height:650px;grid-template-columns:230px 1fr 280px 330px}
body.present .life{font-size:40px}
body.present .dgrid{height:290px;grid-template-columns:1fr 440px}
body.present .transport,body.present footer,body.present .keys{display:none}
body.present #timeline{height:18px}
body.present .why{font-size:14px}
@media (max-width:1100px){#board{grid-template-columns:170px 1fr 220px;height:auto}#log{display:none}.dgrid{grid-template-columns:1fr;height:auto}.treewrap{height:360px}}
</style>
</head>

<header><h1 id="title"></h1><span class="sub" id="subtitle"></span><span class="vs"><b class="us" id="nameA"></b> vs <b class="them" id="nameB"></b></span></header>
<div class="phasebar"><span class="turn" id="turn"></span><span class="who" id="who"></span><span class="steps" id="steps"></span><span class="chip" id="dchip"></span><span class="clock" id="clock"></span></div>

<div id="board">
  <div class="leftcol">
    <div class="ppanel them" id="panelB"></div>
    <div id="preview"><img alt=""><div class="pvtext">hover a card</div></div>
    <div class="ppanel us" id="panelA"></div>
  </div>
  <div id="battlefield"></div>
  <div class="rightcol"><div id="stack"></div><div id="piles"></div></div>

  <div id="popover"></div>
</div>

<div class="decision">
  <div class="dhead"><span class="dtitle" id="dtitle"></span><span class="keys">← → frames · [ ] decisions · space play · wheel/drag zoom · click a candidate to fold, a leaf for detail · f fit · h hide their hand</span></div>
  <div id="timeline"></div>
  <div class="dgrid">
    <div class="treewrap"><svg id="tree"><g id="pz"></g></svg><div id="treehint">no search at this frame</div><div class="treehelp">double-click to fit</div></div>
    <div id="detail"></div>
  </div>
</div>

<div class="transport">
  <button id="restart" title="restart">⟲</button><button id="stepb">◀</button><button id="play">▶</button><button id="stepf">▶|</button>
  <label>speed <select id="speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select></label>
  <label><input type="checkbox" id="skipauto" checked> skip auto-passes</label>
  <label><input type="checkbox" id="skipev"> skip game-log frames</label>
  <label><input type="checkbox" id="hideB"> hide their hand</label>
  <input type="range" id="scrub" min="0" max="0" value="0"><span id="pos" class="keys"></span>
</div>
<footer id="footer"></footer>

<script>/* Replay Studio v2 — board with card art + interactive decision graph.

const N = FRAMES.length;
const PRESENT = new URLSearchParams(location.search).get('present') === '1';
if (PRESENT) document.body.classList.add('present');

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));

const KINDLBL = {priority: 'priority window', target: 'choose target', choose: 'choice', blockers: 'declare blockers',
  attackers: 'declare attackers', mulligan: 'mulligan', leaf_eval: 'search', turn_plan: 'turn plan', mode: 'choose mode',
  use: 'yes / no', announce_x: 'choose X'};
const CHIPLBL = {pilot: 'Pilot', auto: 'Auto', fallback: 'Fallback', search: 'Search', planning: 'Plan', plan: 'Plan-executed', event: 'Game'};

$('title').textContent = META.title || 'Replay';
$('subtitle').textContent = META.subtitle || '';
$('nameA').textContent = META.playerA || 'A';
$('nameB').textContent = META.playerB || 'B';
$('footer').textContent = `${N} frames · ` + Object.entries(META.counts || {}).map(([k, v]) => `${v} ${k}`).join(' · ')
  + (META.result ? ` · result: ${JSON.stringify(META.result)}` : '');

// ---------- card images ----------
function stubSvg(card, name) {
  const c = card || {};
  const nm = esc(name || c.name || '?');
  const tl = esc(c.type_line || '');
  const pt = c.power != null ? `${c.power}/${c.toughness}` : (c.loyalty != null ? `L${c.loyalty}` : '');
  const col = {W: '#e8e2c8', U: '#7fb3e0', B: '#6b6470', R: '#e08a6a', G: '#7fbb8a'}[(c.color || '')[0]] || '#b8ad98';
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='146' height='204' viewBox='0 0 146 204'>
<rect x='2' y='2' width='142' height='200' rx='10' fill='#1d1d1d' stroke='${col}' stroke-width='4'/>
<rect x='12' y='30' width='122' height='90' rx='4' fill='${col}' opacity='.35'/>
<text x='73' y='22' font-family='sans-serif' font-size='11' font-weight='700' fill='#eee' text-anchor='middle'>${nm.length > 22 ? nm.slice(0, 21) + '…' : nm}</text>
<text x='73' y='138' font-family='sans-serif' font-size='9' fill='#ccc' text-anchor='middle'>${tl.length > 26 ? tl.slice(0, 25) + '…' : tl}</text>
<text x='128' y='194' font-family='monospace' font-size='13' font-weight='700' fill='#eee' text-anchor='end'>${pt}</text></svg>`;
  return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
}
const BACK = 'data:image/svg+xml;utf8,' + encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='146' height='204'><rect x='2' y='2' width='142' height='200' rx='10' fill='#3b2a5a' stroke='#8a6dbf' stroke-width='4'/><circle cx='73' cy='102' r='34' fill='none' stroke='#8a6dbf' stroke-width='5'/></svg>`);

function imgSources(key, size, name) {

  const next = () => { if (i < srcs.length) img.src = srcs[i++]; else img.src = stub; };
  img.onerror = () => { if (img.src !== stub) next(); };
  next();
}

// ---------- board ----------
let prevIds = new Set(), prevLife = {A: null, B: null};
const HANDHIDE = {B: false};

function cardEl(ref, opts) {
  opts = opts || {};

  const d = document.createElement('div');
  d.className = 'c' + (ref.tapped ? ' tapped' : '') + (ref.sick ? ' sick' : '') + (ref.attacking ? ' attacking' : '')
    + (ref.blocking ? ' blocking' : '') + (opts.enter ? ' enter' : '') + (ref.face_down ? ' fd' : '') + (ref.token ? ' token' : '');
  d.dataset.id = ref.id; d.dataset.key = ref.key || '';
  const img = document.createElement('img');
  if (ref.face_down || opts.hidden) img.src = BACK; else setImg(img, ref.transformed && card.back ? backKey(ref.key) : ref.key, 'small', ref.name);
  d.appendChild(img);
  if (ref.power != null) {
    const pt = document.createElement('div');
    pt.className = 'pt' + (ref.damage ? ' hurt' : '');
    pt.textContent = `${ref.power}/${ref.toughness}` + (ref.damage ? ` −${ref.damage}` : '');
    d.appendChild(pt);
  }
  if (ref.loyalty != null) { const l = document.createElement('div'); l.className = 'loy'; l.textContent = ref.loyalty; d.appendChild(l); }

  if (ctr.length) {

    d.appendChild(b);
  }
  if (ref.sick && ref.power != null) { const s = document.createElement('div'); s.className = 'badge sickb'; s.textContent = 'zz'; s.title = 'summoning sick'; d.appendChild(s); }

}

function pileEl(label, refs) {

// ---------- arrows ----------
function centerOf(el, base) {
  const r = el.getBoundingClientRect(), b = base.getBoundingClientRect();

}
function drawArrows() {

  svg.setAttribute('width', bb.width); svg.setAttribute('height', bb.height);
  const f = FRAMES[cur], b = f.board;
  let out = '';
  const find = (id) => board.querySelector(`[data-id="${CSS.escape(id)}"]`);
  const arrow = (from, to, cls) => {
    if (!from || !to) return;
    const a = centerOf(from, board), c = centerOf(to, board);
    const mx = (a.x + c.x) / 2, my = (a.y + c.y) / 2 - Math.abs(c.x - a.x) * 0.15 - 20;
    out += `<path class="arr ${cls}" d="M${a.x},${a.y} Q${mx},${my} ${c.x},${c.y}"/>`;

  // stack -> targets

    (it.targets || []).forEach((t) => {
      const to = t.kind === 'player' ? $('panel' + t.name) : (find(t.id) || board.querySelector(`[data-sid="${CSS.escape(t.id)}"]`));

  svg.innerHTML = `<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>` + out;
}
function whenImagesReady(root, timeout) {
  const imgs = Array.from(root.querySelectorAll('img')).filter((i) => !i.complete);
  if (!imgs.length) return Promise.resolve();
  return new Promise((res) => {
    let n = imgs.length; const done = () => { if (--n <= 0) res(); };
    imgs.forEach((i) => { i.addEventListener('load', done, {once: true}); i.addEventListener('error', done, {once: true}); });

// ---------- decision tree ----------
const collapsed = {};          // frameIndex -> Set(nodeId)
let view = {k: 1, x: 0, y: 0}; // pan/zoom
let selected = null;
const CH = 6.9, GAP = 26, ROWH = 30;

function visibleNodes(tree, fi) {
  const col = collapsed[fi] || new Set();
  const byId = {}; tree.nodes.forEach((n) => byId[n.id] = n);
  const hidden = new Set();
  tree.nodes.forEach((n) => { let p = n.parent; while (p != null) { if (col.has(p)) { hidden.add(n.id); break; } p = byId[p].parent; } });
  return tree.nodes.filter((n) => !hidden.has(n.id)).map((n) => Object.assign({}, n, {collapsed: col.has(n.id)}));
}
function subtreeStats(tree, id) {
  const byId = {}; tree.nodes.forEach((n) => byId[n.id] = n);
  let leaves = 0;
  tree.nodes.forEach((n) => { if (n.kind === 'leaf') { let p = n.parent; while (p != null) { if (p === id) { leaves++; break; } p = byId[p].parent; } } });
  return leaves;
}
function layoutTree(nodesIn, tree) {
  const nodes = nodesIn.map((n) => Object.assign({}, n, {children: []}));
  const byId = {}; nodes.forEach((n) => byId[n.id] = n);
  nodes.forEach((n) => { if (n.parent != null && byId[n.parent]) byId[n.parent].children.push(n); });
  const maxDepth = Math.max(...nodes.map((n) => n.depth));
  nodes.forEach((n) => { if (n.collapsed) n.pill = `+${subtreeStats(tree, n.id)} leaves`; });
  let y = 12;
  function place(n) {
    if (!n.children.length) { n.y = y + ROWH / 2; y += ROWH; return; }
    n.children.forEach(place);
    n.y = (n.children[0].y + n.children[n.children.length - 1].y) / 2;
  }
  place(byId[0]);
  const extra = (n) => n.kind === 'leaf' ? 92 : (n.kind === 'candidate' && n.agg != null ? 56 : 0) + (n.pill ? 80 : 0);
  const fixed = [], label = [];
  for (let d = 0; d <= maxDepth; d++) {
    const col = nodes.filter((n) => n.depth === d);
    label[d] = Math.min(44, Math.max(...col.map((n) => n.label.length))) * CH + 3;
    fixed[d] = 14 + Math.max(...col.map(extra)) + GAP;
  }
  const colW = fixed.map((f, d) => f + label[d]);
  const x0 = []; colW.reduce((acc, w, d) => { x0[d] = acc; return acc + w; }, 10);
  nodes.forEach((n) => {
    n.x = x0[n.depth];
    const maxW = colW[n.depth] - GAP;
    n.fit = Math.max(6, Math.floor((maxW - 14 - extra(n)) / CH + 0.1));
    n.text = n.label.length > n.fit ? n.label.slice(0, n.fit - 1) + '…' : n.label;
    n.w = n.kind === 'leaf' ? maxW : Math.min(maxW, 14 + n.text.length * CH + extra(n));
    n.h = 26;
  });
  const W = x0[maxDepth] + colW[maxDepth], H = y + 12;
  return {nodes, byId, W, H};
}
function scoreColor(s) {
  if (s == null) return 'var(--faint)';
  const t = Math.max(0, Math.min(1, s / 100));
  return `rgb(${Math.round(214 + (132 - 214) * t)},${Math.round(119 + (181 - 119) * t)},${Math.round(109 + (110 - 109) * t)})`;
}
let lastLayout = null;
function renderTree(f, animate) {
  const svg = $('tree'), g = $('pz');
  const tree = f.decision && f.decision.tree;
  $('treehint').hidden = !!tree;
  if (!tree) { g.innerHTML = ''; lastLayout = null; return; }
  const {nodes, byId, W, H} = layoutTree(visibleNodes(tree, cur), tree);
  lastLayout = {W, H};
  const chosenPath = new Set();
  tree.nodes.forEach((n) => { if (n.chosen) { let p = n; const all = {}; tree.nodes.forEach((m) => all[m.id] = m); while (p) { chosenPath.add(p.id); p = p.parent != null ? all[p.parent] : null; } } });
  const order = {}; let k = 0;
  nodes.slice().sort((a, b) => a.depth - b.depth || a.y - b.y).forEach((n) => order[n.id] = k++);
  const dt = animate ? Math.min(90, 2200 / Math.max(1, nodes.length)) : 0;
  let out = '';
  nodes.forEach((n) => {
    if (n.parent == null || !byId[n.parent]) return;
    const p = byId[n.parent];
    const x1 = p.x + p.w, y1 = p.y, x2 = n.x, y2 = n.y, mx = (x1 + x2) / 2;
    const cls = 'edge' + (chosenPath.has(n.id) && chosenPath.has(p.id) ? ' chosen' : '');
    out += `<path class="${cls}" d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}" style="animation-delay:${order[n.id] * dt}ms"></path>`;
  });
  nodes.forEach((n) => {
    const dim = tree.chosen != null && n.depth >= 1 && !chosenPath.has(n.id) && n.kind !== 'group';
    const cls = ['node', n.kind, n.chosen ? 'chosen' : '', dim ? 'dim' : '', selected === n.id ? 'sel' : '', n.collapsed ? 'col' : ''].join(' ');
    const ty = n.y + 4;
    let inner = `<rect x="${n.x}" y="${n.y - n.h / 2}" width="${n.w}" height="${n.h}" rx="5"></rect>`;
    if (n.kind === 'leaf') {
      const life = n.life ? `${n.life[0]}–${n.life[1]}` : '';
      inner += `<text x="${n.x + 7}" y="${ty}">${esc(n.text)}</text><text class="lifetxt" x="${n.x + n.w - 62}" y="${ty}">${esc(life)}</text>` +
        `<text class="score" x="${n.x + n.w - 26}" y="${ty}" style="fill:${scoreColor(n.score)}">${n.score ?? '–'}</text>`;
    } else {
      inner += `<text x="${n.x + 7}" y="${ty}">${esc(n.text)}</text>`;
      if (n.kind === 'candidate' && n.agg != null) inner += `<text class="agg" text-anchor="end" x="${n.x + n.w - (n.pill ? 86 : 6)}" y="${ty}" style="animation-delay:${order[n.id] * dt + 1200}ms">${n.agg}</text>`;
      if (n.pill) inner += `<text class="pill" text-anchor="end" x="${n.x + n.w - 6}" y="${ty}">${esc(n.pill)}</text>`;
    }
    out += `<g class="${cls}" data-node="${n.id}" style="animation-delay:${order[n.id] * dt}ms">${inner}</g>`;
  });
  g.innerHTML = out;
  svg.classList.toggle('anim', !!animate);
  g.querySelectorAll('.node').forEach((el) => {
    const id = +el.dataset.node, n = tree.nodes[id];
    el.addEventListener('click', (ev) => { ev.stopPropagation(); onNodeClick(n, tree); });
    el.addEventListener('mousemove', (ev) => showTip(ev, n));
    el.addEventListener('mouseleave', hideTip);
  });
  fitTree();
}
function onNodeClick(n, tree) {
  if (n.kind === 'candidate' || n.kind === 'branch' || n.kind === 'group') {
    const s = collapsed[cur] = collapsed[cur] || new Set();
    if (s.has(n.id)) s.delete(n.id); else if (tree.nodes.some((m) => m.parent === n.id)) s.add(n.id);

}
function showTip(ev, n) {

  if (n.kind === 'leaf') html += `<div>score <b style="color:${scoreColor(n.score)}">${n.score ?? '–'}</b>${n.heuristic != null ? ` · heuristic ${n.heuristic}` : ''}${n.life ? ` · life ${n.life[0]}–${n.life[1]}` : ''}</div>` +
    (n.our_board ? `<div class="tb">us: ${esc(n.our_board)}</div><div class="tb">them: ${esc(n.opp_board)}</div>` : '');
  if (n.kind === 'candidate' && n.agg != null) html += `<div>aggregate <b>${n.agg}</b> (${esc(n.rule || '')}) · ${n.n_leaves} leaves · click to ${(collapsed[cur] || new Set()).has(n.id) ? 'expand' : 'collapse'}</div>`;

function hideTip() { $('tip').classList.remove('on'); }

// pan / zoom
function applyView() { $('pz').setAttribute('transform', `translate(${view.x},${view.y}) scale(${view.k})`); }
function fitTree() {
  const svg = $('tree'); const box = svg.getBoundingClientRect();
  if (!lastLayout) return;
  const k = Math.max(0.3, Math.min(PRESENT ? 1.5 : 1.25, (box.width - 20) / lastLayout.W, (box.height - 20) / lastLayout.H));
  view = {k, x: Math.max(10, (box.width - lastLayout.W * k) / 2), y: Math.max(10, (box.height - lastLayout.H * k) / 2)};

(function bindPanZoom() {

// ---------- detail panel ----------
function chips(s) { return (s || '').split(/[;,|]/).map((x) => x.trim()).filter(Boolean).map((x) => `<span class="chipx">${esc(x)}</span>`).join(''); }
function renderDetail(f, node, tree) {

    html += `<div class="dh">candidate${node.chosen ? ' · chosen' : ''}</div><div class="dline">${esc(node.full || node.label)}</div>
      <div class="kv">aggregate <b>${node.agg ?? '–'}</b> ${node.rule ? `(${esc(node.rule)})` : ''} · ${leaves.length} leaves</div>` +
      leaves.map((l) => `<div class="scorebar small" data-leaf="${l.id}"><div style="width:${Math.max(0, Math.min(100, l.score || 0))}%;background:${scoreColor(l.score)}"></div><span>${l.score ?? '–'} · ${esc((l.full || l.label).replace(/^[^|]*\|\s*/, '').slice(0, 70))}</span></div>`).join('');

    html += `<div class="dh">${esc(CHIPLBL[f.src] || f.src)}${kl && kl !== (CHIPLBL[f.src] || '').toLowerCase() ? ' · ' + esc(kl) : ''}${dec.decision ? ' · ' + esc(dec.decision) : ''}${dec.leaf_count ? ` · ${dec.leaf_count} leaves` : ''}</div>`;
    if (dec.why) html += `<div class="why">${esc(dec.why)}</div>`;
    if (dec.plan) html += `<div class="plan"><b>plan</b> ${esc(dec.plan)}</div>`;
    if (dec.note) html += `<div class="plan"><b>plan step</b> ${esc(dec.note)}</div>`;
    if (dec.chosen_line) html += `<div class="plan"><b>line</b> ${esc(typeof dec.chosen_line === 'string' ? dec.chosen_line : dec.chosen_line.label || JSON.stringify(dec.chosen_line))}</div>`;
    if (dec.options && dec.options.length) {
      const picked = dec.response && dec.response.choice;
      html += `<div class="options">${dec.options.map((o) => `<div class="opt${o.index === picked ? ' picked' : ''}"><span class="oi">${o.index}</span>${esc(o.text || '')}</div>`).join('')}</div>`;
    }
    if (dec.response) html += `<div class="answer">${esc(JSON.stringify(dec.response)).slice(0, 300)}</div>`;
  } else if (f.events && f.events.length) {
    html += `<div class="dh">game log</div>` + f.events.map((e) => `<div class="evd">${esc(e.text)}</div>`).join('');
  } else {
    html += `<div class="dh">${esc(CHIPLBL[f.src] || '')}</div>`;
  }
  d.innerHTML = html;
  d.querySelectorAll('[data-leaf]').forEach((el) => el.addEventListener('click', () => { const l = tree.nodes[+el.dataset.leaf]; selected = l.id; renderTree(f, false); renderDetail(f, l, tree); }));
}
function underNode(tree, n, id) { let p = n.parent; while (p != null) { if (p === id) return true; p = tree.nodes[p].parent; } return false; }

// ---------- timeline ----------
function buildTimeline() {
  const tl = $('timeline'); const items = META.timeline || [];
  const W = 1000;
  let html = `<svg viewBox="0 0 ${W} 22" preserveAspectRatio="none">`;
  let lastTurn = null;
  FRAMES.forEach((f, i) => { if (f.turn !== lastTurn && f.turn) { const x = (i / Math.max(1, N - 1)) * W; html += `<line x1="${x}" y1="0" x2="${x}" y2="22" class="tk"/><text x="${x + 2}" y="8" class="tt">${f.turn}</text>`; lastTurn = f.turn; } });
  html += '</svg>';
  items.forEach((it) => {
    const x = (it.i / Math.max(1, N - 1)) * 100;
    const r = it.src === 'search' || it.src === 'planning' ? 6 : it.src === 'pilot' ? 5 : 3;
    html += `<div class="dot ${it.src}" data-f="${it.i}" style="left:${x}%;width:${r * 2}px;height:${r * 2}px;margin-left:-${r}px;${it.agg != null ? `background:${scoreColor(it.agg)};` : ''}" title="${esc(`T${it.turn} ${it.src}${it.agg != null ? ' agg ' + it.agg : ''}`)}"></div>`;
  });
  html += `<div class="cursor" id="tlcur"></div>`;
  tl.innerHTML = html;
  tl.addEventListener('click', (ev) => {
    const dot = ev.target.closest('.dot');
    if (dot) { goto(+dot.dataset.f, true); return; }
    const r = tl.getBoundingClientRect(); goto(Math.round((ev.clientX - r.left) / r.width * (N - 1)), true);
  });
}
function updateTimeline() { $('tlcur').style.left = (cur / Math.max(1, N - 1) * 100) + '%'; }

// ---------- transport ----------
let cur = 0, playing = false, timer = null;
function render(animate) {
  const f = FRAMES[cur];
  closePopover(); hideTip(); selected = null;
  renderBoard(f, animate);
  $('dtitle').textContent = (KINDLBL[f.kind] || f.kind || (f.src === 'event' ? 'game log' : '')).toUpperCase() +
    (f.decision && f.decision.decision ? `: ${f.decision.decision.toUpperCase()}` : '') + (f.decision && f.decision.leaf_count ? ` (${f.decision.leaf_count} simulated leaves)` : '');
  renderTree(f, animate);
  renderDetail(f, null, f.decision && f.decision.tree);
  updateLog(); updateTimeline();
  $('scrub').value = cur; $('pos').textContent = `${cur + 1} / ${N}`;
}
function frameDuration(i) { const f = FRAMES[i ?? cur]; return (f.dur || 1500) / parseFloat($('speed').value || '1'); }
function skippable(i) { const f = FRAMES[i]; return (f.src === 'auto' && $('skipauto').checked) || (f.src === 'event' && $('skipev').checked); }
function nextIndex(i) { let j = i + 1; while (j < N && skippable(j)) j++; return j < N ? j : null; }
function goto(i, animate) { cur = Math.max(0, Math.min(N - 1, i)); render(animate !== false); }
function next() { const j = nextIndex(cur); if (j == null) return null; goto(j, true); return j; }
function prevDecision() { for (let j = cur - 1; j >= 0; j--) if (FRAMES[j].decision && !['auto', 'plan'].includes(FRAMES[j].src)) { goto(j, true); return; } }
function nextDecision() { for (let j = cur + 1; j < N; j++) if (FRAMES[j].decision && !['auto', 'plan'].includes(FRAMES[j].src)) { goto(j, true); return; } }
function tick() { if (!playing) return; const j = next(); if (j == null) { setPlaying(false); return; } timer = setTimeout(tick, frameDuration()); }
function setPlaying(p) { playing = p; $('play').textContent = p ? '❚❚' : '▶'; clearTimeout(timer); if (p) timer = setTimeout(tick, frameDuration()); }

$('play').onclick = () => setPlaying(!playing);
$('restart').onclick = () => { setPlaying(false); goto(0, true); };
$('stepb').onclick = () => { setPlaying(false); goto(cur - 1, false); };
$('stepf').onclick = () => { setPlaying(false); goto(cur + 1, true); };
$('scrub').max = N - 1; $('scrub').oninput = (e) => { setPlaying(false); goto(+e.target.value, false); };
$('hideB').onchange = (e) => { HANDHIDE.B = e.target.checked; render(false); };
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (e.key === ' ') { e.preventDefault(); setPlaying(!playing); }
  else if (e.key === 'ArrowRight') { setPlaying(false); goto(cur + 1, true); }
  else if (e.key === 'ArrowLeft') { setPlaying(false); goto(cur - 1, false); }
  else if (e.key === ']') { setPlaying(false); nextDecision(); }
  else if (e.key === '[') { setPlaying(false); prevDecision(); }
  else if (e.key === 'f') fitTree();
  else if (e.key === '+' || e.key === '=') { view.k *= 1.15; applyView(); }
  else if (e.key === '-') { view.k /= 1.15; applyView(); }
  else if (e.key === 'e') { $('skipev').checked = !$('skipev').checked; }
  else if (e.key === 'h') { $('hideB').checked = !$('hideB').checked; HANDHIDE.B = $('hideB').checked; render(false); }
  else if (e.key === 'Escape') { closePopover(); hideTip(); }
});
document.addEventListener('click', (e) => { if (!e.target.closest('#popover') && !e.target.closest('.pile')) closePopover(); });
window.addEventListener('resize', () => { drawArrows(); fitTree(); });

buildLog(); buildTimeline();
goto(0, true);

window.__replay = {
  get total() { return N; },
  index: () => cur,
  goto: (i, animate) => { setPlaying(false); goto(i, animate); },
  next: () => { setPlaying(false); return next(); },
  duration: (i) => frameDuration(i),
  frame: (i) => { const f = FRAMES[i ?? cur]; return {turn: f.turn, phase: f.phase, step: f.step, src: f.src, kind: f.kind, snap: f.snap}; },
  ready: () => whenImagesReady($('board'), 4000),
  fit: fitTree,
};
})();
</script>
</body>
</html>
